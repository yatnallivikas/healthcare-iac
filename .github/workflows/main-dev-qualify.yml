name: Main Dev Qualify

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build_artifact:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.compute.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Compute image tag
        id: compute
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy_dev:
    runs-on: ubuntu-latest
    needs: build_artifact
    environment: dev
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to dev cluster
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name healthcare-eks-dev

      - name: Deploy nginx test
        run: |
          IMAGE_TAG="${{ needs.build_artifact.outputs.image_tag }}"
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-test
            namespace: dev
            labels:
              app: nginx-test
              version: "${IMAGE_TAG}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx-test
            template:
              metadata:
                labels:
                  app: nginx-test
                  version: "${IMAGE_TAG}"
              spec:
                containers:
                - name: nginx
                  image: nginx:1.27-alpine
                  ports:
                  - containerPort: 80
          EOF
          kubectl rollout status deployment/nginx-test -n dev --timeout=120s

  dev_qualification_tests:
    runs-on: ubuntu-latest
    needs:
      - deploy_dev
      - build_artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dev qualification tests
        run: ./scripts/dev_qualification_tests.sh "${{ needs.build_artifact.outputs.image_tag }}"

  promote_staging:
    runs-on: ubuntu-latest
    needs:
      - dev_qualification_tests
      - build_artifact
    environment: staging
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to staging cluster
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name healthcare-eks-staging

      - name: Deploy nginx test to staging
        run: |
          IMAGE_TAG="${{ needs.build_artifact.outputs.image_tag }}"
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-test
            namespace: staging
            labels:
              app: nginx-test
              version: "${IMAGE_TAG}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: nginx-test
            template:
              metadata:
                labels:
                  app: nginx-test
                  version: "${IMAGE_TAG}"
              spec:
                containers:
                - name: nginx
                  image: nginx:1.27-alpine
                  ports:
                  - containerPort: 80
          EOF
          kubectl rollout status deployment/nginx-test -n staging --timeout=120s
