name: PR CI

on:
  pull_request:

jobs:
  terraform_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.1

      - name: Terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan (all environments)
        working-directory: terraform
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            echo "::group::terraform plan ${env}"
            terraform plan -var-file=environments/${env}.tfvars -lock=false -input=false
            echo "::endgroup::"
          done

  k8s_manifest_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder manifest validation
        run: |
          echo "kustomize build overlays/dev (TODO)"
          echo "kustomize build overlays/staging (TODO)"
          echo "kustomize build overlays/prod (TODO)"
