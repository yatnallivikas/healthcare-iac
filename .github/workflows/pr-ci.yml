name: PR CI

on:
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  terraform_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan (all environments)
        working-directory: terraform
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            echo "::group::terraform plan ${env}"
            terraform workspace select -or-create ${env}
            terraform plan -var-file=environments/${env}.tfvars -input=false
            echo "::endgroup::"
          done

  k8s_manifest_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder manifest validation
        run: |
          echo "kustomize build overlays/dev (TODO)"
          echo "kustomize build overlays/staging (TODO)"
          echo "kustomize build overlays/prod (TODO)"
