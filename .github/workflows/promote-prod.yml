name: Promote Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote"
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to prod cluster
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name healthcare-eks-prod
          echo "Deploying ${{ inputs.image_tag }} to healthcare-eks-prod (TODO: kubectl apply)"

      - name: Post-deploy smoke tests
        run: |
          echo "Running post-deploy smoke tests (TODO)"
