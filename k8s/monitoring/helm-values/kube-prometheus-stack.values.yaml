defaultRules:
  create: true
  rules:
    etcd: false
    kubeScheduler: true
    kubeControllerManager: true
    kubeProxy: false

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  tolerations: []
  admissionWebhooks:
    patch:
      enabled: true

prometheus:
  serviceMonitor:
    selfMonitor: true
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
  ingress:
    enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

rbac:
  create: true

grafana:
  enabled: true
  adminUser: admin
  adminPassword: CHANGEME-CHANGE

nodeExporter:
  enabled: true

grafana:
  enabled: true
  adminUser: admin
  adminPassword: CHANGEME-UPDATE-BEFORE-APPLY
  service:
    type: LoadBalancer
    port: 80
  ingress:
    enabled: false
  defaultDashboardsTimezone: browser
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true

      editable: false
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

rbac:
  create: true
