apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/kube-state-overview.json
      - dashboards/app-logs-overview.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: grafana-dashboards
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: healthcare-platform
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/managed-by: kustomize
    monitoring: "true"
      - dashboards/sample-dashboard.json
